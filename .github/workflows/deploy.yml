name: Deploy Next.js to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          echo "🚀 Starting deployment on VPS..."

          cd ~/web/yongshi-nirman-sewa || {
            mkdir -p ~/web && cd ~/web
            git clone git@github.com:satri-tech/yongshi-nirman-sewa.git
            cd yongshi-nirman-sewa
          }

          echo "📥 Pulling latest code..."
          git fetch --all
          git reset --hard origin/master

          echo "📦 Installing dependencies..."
          npm ci --legacy-peer-deps

          echo "🗄️ Applying Prisma migrations..."
          npx prisma migrate deploy || echo "⚠️ Migration failed, skipping!"

          echo "⚡ Generating Prisma client..."
          npx prisma generate

          echo "🏗️ Building Next.js app..."
          npm run build

          echo "🔄 Restarting PM2..."
          pm2 describe yongshi-app > /dev/null 2>&1 && \
            pm2 restart yongshi-app || \
            pm2 start npm --name "yongshi-app" -- start

          echo "✅ Deployment finished!"
          EOF
